
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Alislamiah AI</title>
<link rel="icon" href="icon.png">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,sans-serif;background:#fff;color:#fff
}
.topbar{
  height:48px;display:flex;align-items:center;
  direction:ltr;padding:0 8px 0 14px;gap:12px;
  background:#101820;border-bottom:1px solid #293746;
  position:relative;z-index:20
}
.status{
  flex:1;min-width:0;color:#d6e0eb;
  font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.menu-button{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;
  color:white;font-size:27px;cursor:pointer
}
.menu-button:hover{background:#293746}
.viewer{
  position:absolute;top:48px;left:0;right:0;bottom:0;
  background:#fff
}
.viewer iframe{
  width:100%;height:100%;border:0;display:block
}
.backdrop{
  position:fixed;inset:48px 0 0;
  background:#0007;z-index:29;display:none
}
.backdrop.open{display:block}
.menu{
  display:none;position:fixed;top:48px;right:8px;
  width:min(290px,calc(100vw - 20px));
  padding:7px;background:#18232f;color:white;
  border:1px solid #344352;border-radius:12px;
  box-shadow:0 10px 35px #0008;z-index:30
}
.menu.open{display:block}
.menu button{
  width:100%;min-height:46px;display:flex;
  align-items:center;gap:12px;padding:10px 12px;
  border:0;border-radius:8px;background:transparent;
  color:#f5f7fa;font-size:14px;text-align:right;
  cursor:pointer
}
.menu button:hover{background:#293746}
.symbol{width:22px;text-align:center;font-size:18px}
.menu hr{border:0;border-top:1px solid #344352;margin:6px 4px}
</style>
</head>

<body>

<header class="topbar">
  <div class="status">Running in Alislamiah AI</div>
  <button class="menu-button" id="menuButton"
          aria-label="More options" aria-expanded="false">⋮</button>
</header>

<div class="backdrop" id="backdrop"></div>

<nav class="menu" id="menu">
  <button id="shareButton">
    <span class="symbol">↗</span>
    <span>Share</span>
  </button>

  <button id="copyButton">
    <span class="symbol">🔗</span>
    <span>Copy link</span>
  </button>

  <button id="browserButton">
    <span class="symbol">🌐</span>
    <span>Open in Alislamiah AI</span>
  </button>

  <hr>

  <button id="returnButton">
    <span class="symbol">←</span>
    <span>Return to Outhub</span>
  </button>
</nav>

<main class="viewer">
  <iframe
    src="https://nazim10-u.github.io/nazim/"
    title="Website"
    allow="clipboard-read; clipboard-write">
  </iframe>
</main>

<script>
const MEDAD_URL="https://nazim10-u.github.io/nazim/";

const ALISLAMIAH_URL=
"https://mohamedmadoui5195.github.io/Alislamiah-AI/results.html?q=Nazim";

const menu=document.getElementById("menu");
const menuButton=document.getElementById("menuButton");
const backdrop=document.getElementById("backdrop");

function openMenu(){
  menu.classList.add("open");
  backdrop.classList.add("open");
  menuButton.setAttribute("aria-expanded","true");
}

function closeMenu(){
  menu.classList.remove("open");
  backdrop.classList.remove("open");
  menuButton.setAttribute("aria-expanded","false");
}

menuButton.addEventListener("click",()=>{
  menu.classList.contains("open")?closeMenu():openMenu();
});

backdrop.addEventListener("click",closeMenu);

async function copyLink(){
  closeMenu();

  try{
    await navigator.clipboard.writeText(MEDAD_URL);
    alert("Link copied");
  }catch(e){
    const field=document.createElement("textarea");
    field.value=MEDAD_URL;
    field.style.position="fixed";
    field.style.left="-9999px";
    document.body.appendChild(field);
    field.select();

    let copied=false;
    try{copied=document.execCommand("copy")}catch(e){}

    field.remove();
    alert(copied?"Link copied":MEDAD_URL);
  }
}

async function sharePage(){
  closeMenu();

  if(navigator.share){
    try{
      await navigator.share({
        title:"Medad",
        url:MEDAD_URL
      });
    }catch(e){}
  }else{
    await copyLink();
  }
}

function openInAlislamiah(){
  window.location.href=ALISLAMIAH_URL;
}

function returnToOuthub(){
  window.location.href="index.html";
}

document.getElementById("copyButton")
  .addEventListener("click",copyLink);

document.getElementById("shareButton")
  .addEventListener("click",sharePage);

document.getElementById("browserButton")
  .addEventListener("click",openInAlislamiah);

document.getElementById("returnButton")
  .addEventListener("click",returnToOuthub);
</script>

</body>
</html>
