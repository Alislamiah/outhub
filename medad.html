
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>مداد | Outhub</title>
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#050b18;
  --panel:#0b1629;
  --border:#1b2c45;
  --cyan:#31d9e8;
  --text:#f1f6ff;
  --muted:#9aabc2;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;min-height:100vh;
}
.topbar{
  height:60px;position:sticky;top:0;z-index:10;
  background:#081326;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.brand{font-weight:bold;white-space:nowrap}
.brand img{width:27px;height:27px;object-fit:contain;vertical-align:middle}
.status{
  font-size:12px;color:var(--cyan);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.menu-btn{
  margin-right:auto;background:transparent;color:white;
  border:1px solid var(--border);border-radius:9px;
  padding:8px 12px;font-size:18px;cursor:pointer;
}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{
  width:250px;flex-shrink:0;background:var(--panel);
  border-left:1px solid var(--border);padding:18px 12px;
}
.sidebar h4{color:var(--muted);font-size:12px;margin:5px 10px 15px}
.side-btn{
  width:100%;display:flex;align-items:center;gap:12px;
  background:transparent;color:var(--text);border:0;
  border-radius:10px;padding:13px 12px;margin-bottom:5px;
  text-align:right;font-size:14px;cursor:pointer;
}
.side-btn:hover{background:#142640;color:var(--cyan)}
.side-btn.return{margin-top:20px;border:1px solid var(--border)}
.main{flex:1;min-width:0;padding:18px}
.page-heading{margin:0 0 8px;font-size:20px}
.description{color:var(--muted);font-size:13px;margin:0 0 18px}
.viewer{
  width:100%;height:calc(100vh - 145px);min-height:420px;
  background:#fff;border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.viewer iframe{width:100%;height:100%;border:0;display:block}
.mobile-backdrop{display:none}
@media(max-width:700px){
  .sidebar{
    position:fixed;z-index:30;top:60px;bottom:0;right:0;
    width:265px;transform:translateX(105%);
    transition:transform .2s ease;
  }
  body.menu-open .sidebar{transform:translateX(0)}
  .mobile-backdrop{
    position:fixed;inset:60px 0 0;background:#0009;
    z-index:20;
  }
  body.menu-open .mobile-backdrop{display:block}
  .main{padding:13px}
  .viewer{height:calc(100dvh - 180px);min-height:350px}
  .status{font-size:10px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icon.png" alt="Alislamiah">
    Outhub
  </div>
  <div class="status">● Running in Alislamiah AI browser</div>
  <button class="menu-btn" onclick="toggleMenu()" aria-label="القائمة">☰</button>
</header>

<div class="mobile-backdrop" onclick="toggleMenu()"></div>

<div class="layout">
  <aside class="sidebar">
    <h4>خيارات الصفحة</h4>

    <button class="side-btn" onclick="sharePage()">
      <span>↗</span> Share
    </button>

    <button class="side-btn" onclick="copyLink()">
      <span>🔗</span> Copy link
    </button>

    <button class="side-btn" onclick="openInAlislamiah()">
      <span>🌐</span> Open in Alislamiah AI browser
    </button>

    <button class="side-btn return" onclick="returnToOuthub()">
      <span>←</span> Return to Outhub
    </button>
  </aside>

  <main class="main">
    <h2 class="page-heading">مداد — تعلم البرمجة</h2>
    <p class="description">
      تعلم تنظيم وكتابة الأكواد باحترافية.
    </p>

    <section class="viewer">
      <iframe
        src="https://nazim10-u.github.io/nazim/"
        title="مداد - تعلم البرمجة"
        allow="clipboard-read; clipboard-write"
        loading="eager">
      </iframe>
    </section>
  </main>
</div>

<script>
const MEDAD_URL = "https://nazim10-u.github.io/nazim/";
const BROWSER_URL =
  "https://mohamedmadoui5195.github.io/Alislamiah-AI/results.html";

function toggleMenu(){
  document.body.classList.toggle("menu-open");
}

function copyLink(){
  const url = MEDAD_URL;

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url)
      .then(()=>alert("تم نسخ رابط مداد"))
      .catch(()=>fallbackCopy(url));
  }else{
    fallbackCopy(url);
  }
}

function fallbackCopy(text){
  const input = document.createElement("textarea");
  input.value = text;
  input.style.position = "fixed";
  input.style.opacity = "0";
  document.body.appendChild(input);
  input.select();

  try{
    const ok = document.execCommand("copy");
    alert(ok ? "تم نسخ رابط مداد" : "تعذر النسخ. انسخ الرابط يدوياً: " + text);
  }catch(e){
    alert("انسخ الرابط: " + text);
  }

  input.remove();
}

async function sharePage(){
  const data = {
    title:"مداد | تعلم البرمجة",
    text:"تعلم تنظيم وكتابة الأكواد باحترافية مع مداد",
    url:MEDAD_URL
  };

  if(navigator.share){
    try{ await navigator.share(data); }
    catch(e){}
  }else{
    copyLink();
  }
}

function openInAlislamiah(){
  const url = BROWSER_URL + "?url=" + encodeURIComponent(MEDAD_URL);
  window.location.href = url;
}

function returnToOuthub(){
  if(document.referrer &&
     new URL(document.referrer).origin === location.origin){
    history.back();
  }else{
    window.location.href = "index.html";
  }
}
</script>

</body>
</html>
